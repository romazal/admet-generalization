# Shared defaults for every experiment.
#
# Experiment configs start with `extends: base.yaml` and override only what
# differs, so the values below are stated once rather than copied into five
# files (proposal §5). Anything omitted here falls back to
# `admet.training.DEFAULT_CONFIG`.

dataset:
  name: tox21        # the primary dataset (proposal §3.1)
  tasks: null        # null = all 12 assays

split:
  # `kind` is deliberately not set here: choosing random vs scaffold is the
  # whole point of the main experiment, so every experiment config must say
  # which one it is rather than inheriting a default.
  fractions: [0.8, 0.1, 0.1]   # train / validation / test, MoleculeNet convention
  params: {}

tuning:
  # The same budget for both models is what makes the comparison fair
  # (proposal §3.4). Raising it here raises it for the baseline and the GNN
  # together; never set it per model.
  budget: 8
  metric: roc_auc    # selection metric on the validation set

experiment:
  # Target 5 seeds, minimum 3 (proposal §3.3). Results are reported as mean
  # and standard deviation across these.
  seeds: [0, 1, 2, 3, 4]
  train_fractions: [1.0]

output:
  results_dir: results
  figures_dir: figures
